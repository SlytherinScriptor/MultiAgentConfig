name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["main", "master"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "16"
          # Removed cache and cache-dependency-path to fix setup failure
          # The 'cache-dependency-path' was explicitly set to empty, which can cause issues
          # with actions/setup-node when 'cache: npm' is enabled without a lock file.
          # cache: "npm"
          # cache-dependency-path: '' # Explicitly set to empty as no package-lock.json is committed

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build --if-present

      - name: Test
        run: npm test --if-present -- --watchAll=false --passWithNoTests
