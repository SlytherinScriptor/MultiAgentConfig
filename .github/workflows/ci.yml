name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["main", "master"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18" # Updated to Node.js 18 LTS for better compatibility with React 18
          cache: "npm" # Re-enabled caching, actions/setup-node will determine cache-dependency-path automatically
          cache-dependency-path: 'package-lock.json' # Explicitly set cache-dependency-path to resolve 'Input "cache-dependency-path" cannot be empty' error

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build --if-present

      - name: Test
        run: npm test --if-present -- --watchAll=false --passWithNoTests
