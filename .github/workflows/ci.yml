name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["main", "master"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18" # Updated to Node.js 18 LTS for better compatibility with React 18
          token: ${{ secrets.GITHUB_TOKEN }} # Explicitly provide GITHUB_TOKEN to resolve 'token required' error
          # Removed 'cache: "npm"' as 'package-lock.json' is not committed, preventing caching issues.

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build --if-present

      - name: Test
        run: npm test --if-present -- --watchAll=false --passWithNoTests
